<!DOCTYPE html>
<html lang="ro" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Proiecte școlare — materii și linkuri." />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Română</title>
  <link rel="icon" href="/icons/mark.svg" type="image/svg+xml" />
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <a href="#main" class="skip-link">Sari la conținut</a>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="5" width="26" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="1.75"/>
        <path d="M9 12h14M9 16.5h10M9 21h7" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
      </svg>
      <span class="brand-title">Română</span>
    </div>
    <div class="actions">
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Temă" title="Temă (D)">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg>
      </button>
      <button type="button" id="adminBtn" class="pill" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span>Admin</span>
      </button>
    </div>
  </header>

  <main id="main" class="page">
    <div class="layout">
      <aside class="side">
        <div class="side-head">
          <h2>Materii</h2>
          <button type="button" id="addSubjectBtn" class="icon-btn" title="Materie nouă" aria-label="Materie nouă">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <nav id="subjectsNav" class="nav-list" aria-label="Materii"></nav>
      </aside>

      <section class="content">
        <div class="content-head">
          <h1 id="subjectTitle">—</h1>
          <button type="button" id="addLinkBtn" class="pill solid" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span>Link</span>
          </button>
        </div>
        <div id="linksList" class="links"></div>
        <p id="emptyState" class="empty">Alege o materie</p>
      </section>
    </div>
  </main>

  <div id="pwModal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <div class="dialog">
      <h3 id="pwTitle">Parolă</h3>
      <input type="password" id="pwInput" autocomplete="current-password" placeholder="••••••••" />
      <p id="pwFeedback" class="hint" role="status"></p>
      <div class="dialog-row">
        <button type="button" id="pwCancel" class="pill">Anulează</button>
        <button type="button" id="pwSubmit" class="pill solid">OK</button>
      </div>
    </div>
  </div>

  <div id="subjectModal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="subjectModalTitle">
    <div class="dialog">
      <h3 id="subjectModalTitle">Materie</h3>
      <input type="text" id="subjectName" maxlength="80" placeholder="Nume" autocomplete="off" />
      <div class="dialog-row">
        <button type="button" id="subjectCancel" class="pill">Anulează</button>
        <button type="button" id="subjectSave" class="pill solid">Salvează</button>
      </div>
    </div>
  </div>

  <div id="linkModal" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="linkModalTitle">
    <div class="dialog">
      <h3 id="linkModalTitle">Link</h3>
      <input type="text" id="linkName" maxlength="120" placeholder="Nume — ex. Copac Octombrie" autocomplete="off" />
      <input type="url" id="linkUrl" maxlength="500" placeholder="https://" autocomplete="off" />
      <div class="dialog-row">
        <button type="button" id="linkCancel" class="pill">Anulează</button>
        <button type="button" id="linkSave" class="pill solid">Salvează</button>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
